  # Focused help.task_start documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:85 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.task_start: |2
    ## help.task_start
    Claim the prepared Queued task under its current Ready approach and Active same-project plan. After a complete unambiguous current-run prepare_task receipt and successful ready_task(), call task_start() separately to bind that same task. Otherwise use task_start(task="<actual queued task UUID>") using the intended identity from existing facts. Explicit empty/null refuses; omission never picks a graph-wide or historical task. A second outstanding preparation or scope/focus change makes omission ambiguous; reset/resume clears it. Successful claim consumes the preparation binding.
    Wait for the actual claim receipt before doing claimed Task work. In selected PAT, finish all Approach Task briefs and readiness before claiming; discovery stays available. Its frozen brief becomes system instructions with declared checks and execution scope for later requests; claim is direct main execution, not another worker or browsing focus. Refusals preserve authority: inspect the owning reason. Never use a placeholder as an ID. A fresh native array cannot prepare and use its future implicit binding together.

