  decision.readiness.ready: "tasks collectively cover the Approach's declared scope; every task serves the goal and is individually bounded with clear behavior and its own acceptance assertions"
  decision.readiness.revise: "declared Approach scope is uncovered, or some task is off-goal, too broad, unclear, or requires a future task for its acceptance assertions"

