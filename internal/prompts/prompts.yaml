    {{.MaximumBytes}}; overage: {{.OverageBytes}} bytes. Zero disables the extra local byte guard;
    the selected decision model still admits the complete input against its actual token window.
  # Fields: none. Used only when the current complete request exceeds its existing limit.
  preparation.readiness_over_budget: >2-
