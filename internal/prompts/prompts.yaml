    Use help(topic="read") or help(topic="graphql") for fuller examples, use cases and recovery. help() returns the overview and indexes; help(topic="guide") returns the comprehensive operating guide for available tools. help(topic="reference.pat") explains one workflow. Unavailable tools are labelled and receive no callable template. Call help with topic; help.read and schema.read are topic strings, not tools. In text compatibility supply topic explicitly; a bare tool name only displays its schema.

