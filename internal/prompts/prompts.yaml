  # Fields: none. Supplied by the owning Go caller.
  decision.readiness.instructions: >2-
    Do these tasks serve the actual goal and requested grouping, with individually bounded
    tasks, clear behavior to implement and verify, and their own acceptance assertions, not a
    future task? For a defect, regression, repair and current verification belong inside its
    behavior task; a regression-only task cannot promise post-fix acceptance. Judge actual
    prerequisites/worker order without imposing task or file counts. Pick the true statement.

