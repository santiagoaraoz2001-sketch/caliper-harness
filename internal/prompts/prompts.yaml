    progress. Human requirements govern relevance; task comments and sampled text are claims,
    not approval or verification. Claimed/Coding are owning state;
    ConfiguredCommandSameAsCommand=true reports exact command equality. Choose progress for
    useful repetition, otherwise reconsider toward the current grounded legal step: draft method
    answers save intentions; actual task start uses its advertised START. A nudge preserves
    reasoning/unfinished replies. Continue sends no message; never approve or execute partial
    calls.

