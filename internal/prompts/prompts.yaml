  # Original use sites: internal/tools/model-guide.md:35 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.bash: >
    ## help.bash

    When bash is advertised, use it for commands without a dedicated tool. Use read/find_file/find_dir/grep
    for inspection, edit/write for source changes, and check for declared verification.
    Timeout/output caps are configured. Nonzero exit is a failure receipt, not a product success.
    Shell inspection preserves a prior declared-check pass when project contents are observed unchanged. Changed or unobserved contents make it stale. Do not treat raw
    shell output as verified task qualification.
  # Focused help.check documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:38 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.check: |2
    ## help.check
    Ordinary coding runs one configured or inspected-project declared check and records its actual current outcome; it needs no PAT. Planned tasks run a paired episode: the frozen acceptance_cmd asserts requested behavior FIRST; cmd runs the configured suite LAST only after acceptance exit0 is durably recorded. Omit arguments only when the CURRENT schema supplies the required defaults (cmd, and acceptance_cmd for a planned task); otherwise use the actual declared literals. The roles may use the same suite if it contains task assertions. Inspect them: two exits0 prove execution, not test adequacy. The acceptance command must exercise a real requested-behavior assertion; a zero-match test selection or generic true does not evidence that behavior. Later source changes or modifying workflow effects require a fresh whole episode. Shell inspection preserves it when project contents are observed unchanged; changed or unobserved contents make it stale. Failed/denied episodes are not automatically retried by host finalization.

  # Focused help.edit documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:29 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.edit: |2
    ## help.edit
    Prefer the smallest unique exact old span for a small change; expected_hash is optional, e.g. `edit(path="src/main.py", old="return 0", new="return value")`. For an entirely observed line span, use inclusive 1-based start_line/end_line, new and read's current sha256 as expected_hash; untouched CRLF/LF bytes remain exact. Do not mix routes. `new=""` deletes intentionally; missing new refuses. Do not reconstruct unchanged functions. Stale hash/range/multiple matches refuse without publication. Encode newlines as \n in JSON strings; text literal slots contain raw lines.

