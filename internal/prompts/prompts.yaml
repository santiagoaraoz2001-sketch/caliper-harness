  # Model-only operating-guide overview; active schemas are still assembled by Go.
  # Original use sites: internal/tools/model-guide.md:1 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.overview: |2-
    # Harness operating guide
    Follow your active role in the real project. For coding, inspect source, implement and check the request; for review, inspect without changing artifacts. Report actual evidence. Use find_file/find_dir for paths, grep for source text, then read the relevant file or declaration. Reuse returned paths, hashes and paging offsets.

    Start with help(topic="schema") for the tools available now. Request schema.<tool> for exact arguments and a compact call template. GraphQL has a separate operation index at schema.graphql; schema.graphql.appendKnowledge saves product decisions or useful paths; schema.graphql.noticed records observations for the current Approach. Request help(topic="<tool>") for use cases and examples, or help(topic="guide") for the comprehensive guide.

    Ordinary coding uses the core tools directly. In the main/orchestrator role, use plan() when useful or requested. Assigned workers/reviewers keep their frozen role. The host binds Plan → Approach → Task identities. Let each answer settle before using the next question. Drafting saves intentions. The later START plan(invoke="EXECUTE") claims work for the main model; explicit launch dispatches workers. Actual checks and independent review qualify work.

    Only current advertised tools can be called. Documentation does not change scope or authorize an effect. Read failures and partial mutation receipts before retrying; preserve applied IDs and actual check outcomes. A success claim cannot replace execution evidence.

  # Focused help.prepare_task documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:44 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.prepare_task: |2
    ## help.prepare_task

    Fresh-only convenience over the same protected GraphQL prepareTask operation. Inspect source and
    answer the argument questions yourself. Author the goal/strategy/task labels and one bounded task;
    necessary steps state purpose, action and validation. Split independent work and resolve
    prerequisites. Reuse suitable existing nodes through graphql instead of duplicating them.

    acceptance_command runs a concrete distinguishing assertion on inspected artifacts/tests, including
    an existing regression or a planned assertion. It must exit nonzero on wrong behavior, not merely print a boolean. It may use the project suite if it contains the task assertions. Omit check_command
    when configured: the host binds its exact literal. When unset, author it from inspected files.
    Explicit empty or mismatched configured values refuse before effects. The actual receipt returns
    stored checkCommand and configuredCheckCommand/proposedCheckCommand identifying its source; both
    values count against the result cap. The host authors neither your brief nor behavioral command.
    Commands are unexecuted until recorded. Verification runs behavior first, project check last.

    Illustrative questions and authored answers for a hypothetical inspected JavaScript repository;
    these are not your task, real source observations or executed results. Assume inspection found
    src/normalize-name.js returns its input unchanged, an existing Node test directory, and a
    configured project check of npm test. Author arguments as:

    ```json
    {
      "plan_title": "Normalize user names",
      "plan_goal": "Names have no surrounding spaces while internal spaces remain unchanged.",
      "approach_title": "Repair normalization with a behavioral regression",
      "task_title": "Trim surrounding spaces",
      "task_prompt": "Fix name normalization and add the distinguishing regression.",
      "current": "Inspected src/normalize-name.js: normalizeName returns input unchanged; surrounding spaces remain. Other callers are not yet verified.",
      "target": "normalizeName removes surrounding spaces and preserves internal spaces.",
      "sketch": "Run regressions on original source, repair normalization, then run the behavioral/project check episode.",
      "acceptance": "A surrounded name becomes unpadded; its internal space is preserved.",
      "tests": "Planned test/normalize-name.test.js checks both behaviors; unexecuted.",
      "verify": "Inspect the function and assertions; independently run behavior first, then npm test.",
      "acceptance_command": "node --test test/normalize-name.test.js"
    }
    ```

    The answers cover what was observed, what must change, how, what distinguishes success, which
    assertions apply, and what the reviewer must inspect. Omitted check_command binds the configured
    command; copy neither these example paths nor its commands without inspecting your real project.

    Inspect all four actual effect receipts/IDs: createPlan, createApproach, createTask, setTaskBlock.
    Complete preparation leaves Draft Plan/Approach and Queued Task, not readiness or execution. One
    complete current-run receipt supplies the default task binding: next call ready_task(), inspect
    successful Ready, then separately task_start(). A fresh native array cannot prepare and use its
    future binding together. Partial/error receipts preserve actual committed IDs and errors; use those facts rather than blindly repeating creation.
    Existing/resumed/ambiguous work uses the intended explicit actual UUID. Omission never selects a
    random or latest graph task; empty/null is not omission.

  # Focused help.read documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:14 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.read: |
    ## help.read
    Read exact file lines or browse immediate directory children. Relative and absolute in-project
    paths return reusable workspace-relative locators; outside discovery requires read_outside/find_outside.
    Use read(path=".") for unknown
    layout; read(path="src/main.go", offset=1, limit=80) for a known range. Offsets are 1-based.
    Returned source bytes are unchanged. Keep the full-file sha256 for edits and page with next_offset.
    Directory pages grant no source/edit coverage. A capped page is partial; do not claim unseen lines.
    For Go files, definition="Name" or "Receiver.method" selects a
    syntax declaration and its docs, including its enclosing type/var/const group. outline=true lists
    declaration names/kinds/ranges for navigation only. Selectors are mutually exclusive and file-only;
    definition starts with offset=1, while outline offset/limit page declaration entries. These locate
    syntax, not imported references or variable bindings. Ordinary read/grep remain the fallback for
    unsupported or malformed files. See help(topic="read.definition") or "read.outline".
    Only returned source grants edit coverage. selection_complete describes the selected declaration;
    EOF describes the whole file. A capped definition's next_offset is an absolute ordinary-read line.
  # Focused help.ready_task documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:47 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.ready_task: |2
    ## help.ready_task
    Propose readiness with ready_task() only after one complete, unambiguous current-run prepare_task receipt; it binds that task. Otherwise use ready_task(task="<actual queued task UUID>") with the intended ID from existing facts. Explicit empty/null is not omission. Historical session text, graph browsing and workflow selection do not supply this default; another outstanding preparation or focus change requires an explicit intended ID.
    The protected action resolves current same-project ancestry, activates a Draft plan only and requests owning Ready with complete-brief, coherence and approval guards. Existing Active plans are reused. Already Ready approaches retain their admission; a Draft parent is still activated. The host resolves the actual selected approach; siblings confer no authority. Source-grounded complete briefs and exact declared commands remain required. Activation can commit before readiness or result-limit failure: retain the committed IDs and actual refusal; never synthesize Ready or repeat an already applied mutation. No task is claimed or executed.
    After successful current Ready, separately invoke task_start() for the same still-valid preparation binding, or task_start(task="<actual queued task UUID>"). Wait for its claim result. Stale, foreign, closed or nonunique ancestry refuses. Resumed/ambiguous/partial work needs explicit actual IDs; reset/resume clears the default binding.

