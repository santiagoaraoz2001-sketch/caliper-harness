  progress.complete: "This Task is verified; follow the current plan question for the next task or parent closure. Task qualification does not complete the Plan."

  # Independent review owner supplies this direction; no coding or sibling work.
  progress.review: >2-
    Review the frozen Task using source, retained edit observations and current check receipts.
    Resolve a concrete missing fact with inspection; when the acceptance evidence is sufficient,
    return PASS, FAIL or UNVERIFIED with the observed reason. Do not implement changes or assess
    unfinished sibling tasks as separate work; report regressions caused by this Task.
    Repeating an already-understood argument without new evidence does not advance this review.

