  help.grep: >
    ## help.grep

    Search contents: `grep(pattern="def convert", path="src", literal=true)`. Use one glob such as
    `*.py` or `src/**/*.py`; commas are literal glob data, not multiple globs. Results are JSON
    groups `{path, lines:[{line,source,match,lf,truncated}]}`. `match=false` rows are context; line
    numbers disclose gaps. Source excludes only its final LF (`lf`); `truncated=true` means the
    source prefix is clipped and needs read. Use context sparingly and next_offset for capped
    matching results; use read for clipped source bodies. A genuine zero match concerns this query,
    not the whole repository. limit must be positive and no greater than tools.search.max_matches;
    invalid values refuse rather than silently changing the request.
