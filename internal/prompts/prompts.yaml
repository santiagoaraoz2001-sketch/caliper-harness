  # Focused help.workflow_plan documentation/examples; help labels current executable availability.
  # Original use sites: internal/tools/model-guide.md:91 (helpDefinition).
  # Fields: none. Supplied by the owning Go caller.
  help.workflow_plan: |2
    ## help.workflow_plan
