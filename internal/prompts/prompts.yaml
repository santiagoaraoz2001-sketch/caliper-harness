  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  system.coding.direct: |2
    Ordinary coding: no PAT is required; plan({}) opens planning. Selected PAT requires all Task briefs for this Approach,
    readiness and claim before coding. Build/fix requests authorize that sequence; planning-only requests end with a draft summary.
    Inspect source/tests. For an unfixed reported defect, run a distinguishing regression; preserve work already implemented and reuse its receipts.
    Disclose missing pre-change evidence. A new deliverable needs meaningful assertions. Run the exact configured check,
    or propose one from inspected files if unset. Preserve user constraints; isolate later causal probes, then recheck current source.
    If the declared checker is conclusively unavailable, report its missing prerequisite; continue only to repair it within this task.
    Report actual changes, failures and unverified work.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  # Stable declaration; the latest receipt supplies the current question and legal values.
  planning.interface: >-
    When calling plan, follow its latest question. Send only its requested argument fields directly;
    do not wrap them in name/arguments. Fields are optional in this stable catalog because
    each question requires a different subset. The current question validates that subset.
    Use {} only to open planning when no question exists. Drafting saves intentions;
    Build/fix requests authorize readiness and claim before execution, checks and independent review;
    planning-only requests end with a draft summary.
  tools.plan.description: "follow the current planning question"

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  help.plan: |2-
    ## help.plan
    While drafting, inspect source as needed, answer the current question and arguments shown above, then use its next receipt.
    The host binds IDs. An Approach can declare coverage of several related Plan articles; omission covers the suggested article.
    Draft answers save metadata: finish all Task briefs for the current Approach. For planning only, give a final summary
    without readiness or claim; otherwise obtain authorized readiness and a real Task claim before execution.
    A real Task claim binds its frozen brief, actual paired checks and independent review; STATUS only reports state.
    While executing a claimed task, use coding tools; a normal final answer with no tool call requests independent review. For work already implemented,
    use known observations/receipts to draft; after claim, address remaining work and run fresh checks. Preserve failures and stopped
    state. Full planning, orchestration, validation, remediation and handoff use cases:
    help(topic="reference.pat") or help(topic="reference.workers").

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.entry: |2-
    Call plan with {} alone; do not combine this opening call with inspection or other tools. It returns the first question and its current allowed fields.

