    Validate/coherence-admit a drafted or paused approach with complete briefs and declared commands. Readiness executes no code; follow the next advertised START or intentional worker launch. A scoped zero-argument schema call reveals documentation only when advertised; actual execution requires invoke="run" if the current schema says so. The full-view approach argument is not accepted in projected views.

