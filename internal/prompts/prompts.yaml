  # Explicit outside discovery; ordinary bound tools retain workspace scope.
  tools.discovery.workspace_scope: >-
    Paths must resolve inside the captured workspace. For another project, use explicit
    read_outside or find_outside with an absolute outside path.
  tools.outside.parameters.path: "explicit absolute file or directory outside the workspace; final symlinks refused"
  tools.read_outside.description: "read bounded outside file lines or directory children"
  tools.read_outside.purpose: >-
    Read an explicit absolute path outside the workspace using the same line/entry and byte caps
    as read. Returned absolute paths are usable in outside discovery. File hashes are informational:
    outside reads grant no edit/write authority or workspace read coverage.
  tools.find_outside.description: "find files or immediate directories outside the workspace"
  tools.find_outside.purpose: >-
    Explicit outside discovery (find.outside): require an absolute directory outside the workspace
    and choose mode=file for the existing recursive, ignore-respecting file finder, or mode=dir
    for immediate real directories including hidden/ignored/empty directories. No symlink following.
    Reuse the same query and next_offset for live paging. Discovery grants no edit/write authority.
  tools.find_outside.parameters.mode: "file: recursive files; dir: immediate real child directories"
  tools.find_outside.parameters.pattern: "file mode: file glob; dir mode: one nonempty basename glob"
  tools.find_outside.parameters.offset: "file mode: matching files to skip (default 0); dir mode: first 1-based matching entry (default 1)"
  tools.find_outside.parameters.limit: "dir mode only: matching entries to return (default tools.bash.max_lines); file mode uses tools.search caps"
  help.read_outside: |
    ## help.read_outside
    Inspect an explicit absolute file/directory outside the workspace. Normal read stays in the
    project. The same output-page line/byte caps and Go definition/outline syntax selectors apply.
    Ordinary read_outside provides the fallback for unsupported or malformed files. Outside reads grant no edit coverage or outside editing authority. Final symlinks
    refuse. Keep returned absolute locators and page with the disclosed next_offset.
  help.find_outside: >-
    ## help.find_outside

    Explicit find.outside discovery uses the native name find_outside. For recursive files:
    find_outside(path="/absolute/other-project", mode="file", pattern="*.go").
    File mode respects ignore rules and tools.search caps; offset defaults to 0 files skipped.
    For immediate real directories: find_outside(path="/absolute/other-project", mode="dir", pattern="*").
    Directory mode includes hidden/ignored/empty directories; offset defaults to 1 and limit to
    tools.bash.max_lines. No recursion in dir mode. Read results with read_outside or descend with
    find_outside. Require an absolute outside root; no final symlinks or paths resolving inside the
    workspace. These routes add no outside edit/write capability; shell execution has its own authorization.

  # Focused instruction; owning tool/runtime supplies the facts. Fields: none.
  help.read.definition: |
    ## help.read.definition
    For a supported Go file, read(path="owner.go", definition="Receiver.method") returns the exact
    syntax declaration plus documentation. A plain name must be unambiguous. Type/var/const names
    return the full enclosing declaration group. offset must be 1; limit and the output byte cap
    apply to returned source. selection_complete is separate from whole-file EOF. Continue a capped definition
    with ordinary read at its absolute next_offset. Only returned source grants coverage.
    This does not resolve imports or local bindings. For unsupported/malformed files,
    use ordinary read/grep; use outline locations to resolve ambiguous names.

  # Focused instruction; owning tool/runtime supplies the facts. Fields: none.
  help.read.outline: |
    ## help.read.outline
    Use read(path="owner.go", outline=true) to locate Go declarations by name/kind/source range and
    full-file hash. offset/limit page 1-based declaration entries. The outline is navigation metadata,
    not source or edit coverage. Read the selected range or definition before editing. Go syntax
    selectors parse the file without a whole-source size cap; only the returned page is bounded.
    Use ordinary read/grep for unsupported or malformed files.
    Do not combine outline with definition or apply either selector to a directory.

  # Focused instruction; owning tool/runtime supplies the facts. Fields: none.
  continuation.discovery_reasoning_scope: >2-
    Past reasoning is unverified. Actual correlated discovery call/results remain in context;
    keep useful unresolved hypotheses distinct from facts. This summary grants no authority.

  # Focused instruction; owning tool/runtime supplies the facts. Fields: none.
  progress.execute: >2-
    For a reported defect still unfixed, run its distinguishing regression then repair it. For work
    already implemented, reuse source and receipts, preserve the fix and address only unmet requirements. For a new deliverable, implement the
    frozen target with real behavioral assertions; do not invent a prior bug. Run the required
    current paired behavioral/project check and report actual results for independent review.
    Never manufacture failure or disable a passing deliverable for a later causal control.

  # Focused instruction; owning tool/runtime supplies the facts. Fields: none.
  progress.validate: "Use the current passed check receipt and actual source/assertions. Give a normal final answer with no tool call to request independent review; do not repeat planning/start or an unchanged passed check."

  # Go source-navigation argument/purpose; executable contract remains in files owner.
  tools.read.parameters.definition: >2-
    exact Go declared name or Receiver.method; offset=1; file-only syntax selector

  # Go source-navigation argument/purpose; executable contract remains in files owner.
  tools.read.parameters.outline: >2-
    Go declaration navigation only; offset/limit page entries; no source coverage

  # Current settlement next action; no requeue or new claim is performed by this guidance.
  progress.rework: "Use the actual settlement; revise/requeue the same task, then obtain Ready and a fresh claim."

  progress.complete: "This Task is verified; follow the current plan question for the next task or parent closure. Task qualification does not complete the Plan."

  # Independent review owner supplies this direction; no coding or sibling work.
  progress.review: >2-
    Review the frozen Task using source, retained edit observations and current check receipts.
    Resolve a concrete missing fact with inspection; when the acceptance evidence is sufficient,
    return PASS, FAIL or UNVERIFIED with the observed reason. Do not implement changes or assess
    unfinished sibling tasks as separate work; report regressions caused by this Task.
    Repeating an already-understood argument without new evidence does not advance this review.

  # Current-run claimed-task advisory; does not create or revoke authority. Fields: none.
  continuation.bookkeeping.claimed_authority_suffix: >2-
    . Your current task claim remains active. Update only a concrete supported bookkeeping gap;
    this advice does not revoke the claim or replace the frozen task, check and review requirements.
  # Phase-aware advisory prefix for an actual current claim. Fields: none.
  continuation.bookkeeping.claimed_next_action: " Checkpoint claimed-task action (advisory): "

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  system.coding.direct: |2
    Execute ordinary coding with core tools; no PAT is required. For guided planning, call plan with {}.
    Once PAT is selected, finish all Task briefs for the current Approach, request readiness, then claim before coding.
    Inspect responsible source and tests. For a reported defect still unfixed, run its distinguishing regression before
    repairing it. For work already implemented, reuse known source and receipts; do not recreate the defect.
    Report missing pre-change evidence honestly.
    For a new deliverable, implement the target with meaningful behavioral assertions.
    Run the exact configured project check, or propose one grounded in inspected files when unset.
    Later effects invalidate a pass. Keep the passing deliverable; a genuinely needed later causal
    control uses an isolated copy followed by a final current check. Preserve user constraints,
    failures and unknowns; report only actual changes and results.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  # Stable declaration; the latest receipt supplies the current question and legal values.
  planning.interface: >-
    When calling plan, follow its latest question. Send only its requested argument fields directly;
    do not wrap them in name/arguments. Fields are optional in this stable catalog because
    each question requires a different subset. The current question validates that subset.
    Use {} only to open planning when no question exists. Drafting saves intentions;
    readiness and claim precede execution, actual checks and independent review.
  tools.plan.description: "follow the current planning question"

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  help.plan: |2-
    ## help.plan
    While drafting, answer the current question and arguments shown above, then use its next receipt.
    The host binds IDs. Draft answers save metadata; the advertised start action claims execution; STATUS only reports state.
    While executing a claimed task, use coding tools; a normal final answer with no tool call requests independent review. Inspect source as needed,
    finish all Task briefs for the current Approach, then request readiness and claim. A real Task claim
    binds its frozen brief, actual paired checks and independent review. For work already implemented,
    use known observations/receipts to draft; after claim, address remaining work and run fresh checks. Preserve failures and stopped
    state. Full planning, orchestration, validation, remediation and handoff use cases:
    help(topic="reference.pat") or help(topic="reference.workers").

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.entry: |2-
    Call plan with {}; returns the first question.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.goal: |2-
    DRAFT PLAN: State outcome, preserved rules, delivery scopes and proof. articles: one deliverable
    per line. One Approach serves one article; its Tasks divide that deliverable. If the user asks for
    one Approach and two fixes, use one combined article, then two Tasks under its Approach. Separate
    articles need separate Approaches. Inspection, regression, repair and checks are Task steps.
    Save draft intentions only and reuse an existing plan's actual focus.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.approach: |2-
    DRAFT APPROACH: State how to deliver the whole displayed Plan article and how its Tasks divide
    that scope. Other articles get their own Approaches. Tasks include implementation/assertions/verification; split independently
    verifiable outcomes, resolve prerequisites before dependent work. This may activate a Draft parent
    and saves an approach; no coding starts. Owning goal/article:

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.task: |2-
    DRAFT TASK: Supply the title and objective of one behavior-owned deliverable. Include implementation,
    assertions and verification within this task; do not put acceptance assertions in a future task.
    Honor the user's task grouping. Later questions draft observations, proof and necessary methods.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.another: |2-
    DRAFT TASKS: plan(invoke="TASK", title="<title>", objective="<outcome>") adds another behavior task.
    Honor requested grouping. Only after all tasks for this approach are drafted, plan(invoke="COMPLETE")
    requests readiness, not execution/qualification. Repair the deficient brief if readiness refuses.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.select: >-
    REMEDIATION/INCOMPLETE WORK: Use advertised NEXT for a sole unresolved Task; otherwise select the actual unresolved task ID from this Approach. Use its current result, review and refusal already supplied; inspect only missing facts before repairing. Do not create a replacement lineage to hide failure.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.observe: |2-
    DRAFT OBSERVATIONS: What did you observe, where, and what remains unknown? What observable
    target should change? Reading a test is not running it. Save observations, not execution claims.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.proof: |2-
    DRAFT PROOF: State observable acceptance, distinguishing existing/proposed assertions and the literal
    behavioral command. This task implements its behavior and assertions; no future task supplies its acceptance.
    For work already implemented, cite known observations/receipts and plan only remaining work plus fresh
    checks and review. For a reported defect still unfixed, reproduce then repair. Mark planned tests unexecuted.
    Name the regression/assertion; its command must exit nonzero on a wrong result, not just print a boolean.
    The configured project check is bound automatically; when unset, propose one from inspected files.
    The two declared roles run in order and may use the same suite if it contains the needed assertions.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.step_objective: |2-
    DRAFT SUBTASK: What must the next step achieve within this behavior task? Answer objective only.
    For a defect, regression → repair → verification are steps of the same task. Method and validation follow.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.step_execution: |2-
    DRAFT METHOD: How will you perform this subtask? Answer execution with concrete intended actions.
    This saves the method; it does not run code. Execution follows drafting and claim.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.step_validation: |2-
    DRAFT VALIDATION: What observation or assertion will show this subtask worked? Answer validation
    with the planned check, not a claim that it ran.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.step_more: |2-
    DRAFT NEXT STEP — planning only. Does this task need another implementation step? There is no fixed count.
    more: true drafts another step. more: false finishes the steps and asks you to define later review criteria.
    Neither starts review or execution. Finish this brief and all remaining Task briefs for this Approach,
    then request readiness and claim the first Task to implement it.
    Actual checks and independent review happen after implementation.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.review: |2-
    DEFINE LATER REVIEW CRITERIA — still planning. What source, behavior, preserved constraints and
    assertions should the independent reviewer inspect after implementation? Answer verify to finish
    this task brief, then return to the Approach to draft remaining Tasks. Only after all its Task briefs
    are drafted, request readiness and claim before execution.
    This answer does not start review or claim that checks passed.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.task_drafted: |2-
    TASK BRIEF DRAFTED — still planning, not executed or verified.
    plan(invoke="NEXT") returns to the Approach. Draft remaining Tasks, then request readiness
    after all its Task briefs are complete. Only a successful claim starts Task execution.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.task_complete: |2-
    TASK VERIFIED: owning check and review receipts qualify this Task.
    plan(invoke="NEXT") returns to the Approach to claim its next queued Task, or assess Approach
    completion when all its Tasks qualify. Do not redraft completed work.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.ready: |2-
    START NEXT TASK: plan(invoke="EXECUTE") claims the next queued task for the main model to implement
    here. Wait for its receipt; the frozen brief becomes system instructions. The host carries IDs,
    approvals, paired checks and independent review. Explicit launch is the delegated-worker alternative.
    Stopped or refused attempts require their current authorized recovery route.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.validated: |2-
    ALL TASKS VERIFIED: compare their actual results with this Approach's objective.
    Report changes to the user, actual verification and limits. If required work remains and TASK is
    offered, plan(invoke="TASK", title="<gap>", objective="<missing outcome>") pauses the Approach
    and drafts the missing Task; completed evidence stays recorded. Finish drafting, recheck readiness, then claim.
    If the objective is satisfied, plan(invoke="NEXT_ARTICLE") completes the Approach and returns to
    the Plan's next deliverable. Follow the next question; do not assume the Plan is finished.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.plan_complete: |2-
    ASSESS PLAN COMPLETION: all authored deliverables have completed Approaches. Compare actual results
    with the original outcome, rules and proof below. If a requirement remains, use the existing revision
    route; do not claim completion. Otherwise report evidence and plan(invoke="COMPLETE") requests
    owning completion. Qualified descendants are necessary; their count alone does not prove the outcome.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.settled: |2-
    This work is settled. plan(invoke="STATUS") preserves its owner without execution or retry.
    Report only actual qualified evidence; select new intended work explicitly.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.remediate: |2-
    REMEDIATE: Use the actual execution/check/reviewer findings below. Explain the primary finding,
    then plan(invoke="REMEDIATE", feedback="<correction>") updates/requeues this existing task. Fresh Ready and
    explicit START remain required. Prior failures stay recorded; no success is implied.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.running: |2-
    TASK RUNNING: planning is finished for this task. Its current executor uses the frozen brief and
    advertised coding tools. Once the required work and current paired check are finished, give a
    normal final answer with no tool call to request independent review. Report actual changes,
    check results and remaining problems. Do not call plan to finish, repeat a current passed check,
    or start the next task before qualification. STATUS is optional inspection, not a handoff.
    If this task belongs to another executor, inspect its status; do not take over its claim.

  # Stopped work retains explicit recovery; a running task uses separate guidance above.
  planning.stopped: |2-
    This task is stopped or cancelled. plan(invoke="STATUS") performs no retry. Use supplied
    owning state; inspect only missing or changed facts. Use the existing resume/rework route only when
    authorized; a managed stop never grants a fresh budget.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.saved: >-
    Selection retained for the next request. Follow the current phase guidance below; this navigation executes no work and grants no qualification.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.title: >-
    What short title names this authored goal or deliverable?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.outcome: >-
    What user outcome must this plan achieve?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.rules: >-
    What constraints and preservation rules apply? State none only when none were requested.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.articles: |2-
    Which ordered deliverables achieve the outcome? One per line; honor requested task grouping.
    Do not turn inspect/test/fix/review steps into separate delivery articles.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.proof: >-
    What observable evidence would establish the plan outcome?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.strategy: "How will this deliverable be implemented and verified through the requested behavior tasks?"

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.objective: "What behavior does this task deliver, or what necessary step advances its stated objective?"

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.task: >-
    Which actual unresolved task do you intend to inspect/repair?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.current: >-
    What was observed, where, and what remains unknown?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.target: >-
    What observable behavior must change?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.acceptance: >-
    What observation establishes the requested behavior?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.tests: "Which existing/proposed assertions distinguish the behavior? This task owns them; mark planned tests unexecuted."

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.acceptance_command: >-
    Which literal command runs the named behavioral assertion and exits nonzero when it is wrong? Printing a boolean alone is not an assertion.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.check_command: >-
    Which project check is grounded in inspected files?

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.execution: "Draft the concrete method for this subtask. This answer saves intentions; it executes nothing."

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.validation: "Draft the observation/assertion that will verify this subtask; this answer runs no check."

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.more: "Does this task need another step? true: draft it; false: finish steps and define later review criteria. Neither starts review or execution."

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.verify: >-
    After implementation, what should the independent reviewer inspect and rerun? This only saves review criteria.

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.invoke: "Choose an invoke value offered by the latest planning question."

  # Guided planning/direct-mode instruction; Go owns phase/schema/authority. Fields: none.
  planning.answer.feedback: >-
    What specific repair addresses the actual validator finding?

  # Guided existing-approach selection; owner validates the actual ID. Fields: none.
  planning.select_approach: >-
    This article already has work. Use advertised NEXT for a sole Approach; otherwise select its actual approach to inspect/continue it. Do not create
    another lineage. Existing complete state is not validation without actual check/review receipts.
  # Guided selection parameter. Fields: none.
  planning.answer.approach: "Which actual approach do you intend to inspect/continue?"

  # D1 advice for the selected guided planner; current claim uses its separate owner. Fields: none.
  preparation.guided_next: |2-
    Answer only plan's current draft question from actual source/owner facts. Draft answers save
    metadata and run no code. Inspect as needed; finish all Task briefs for this Approach before
    readiness and claim. The host binds IDs and supplies the next question; preserve failures and
    partial effects. An actual Task claim binds its frozen brief and verification.

  # Explicit revision guidance. Owning typed receipts select this form; prose never does.
  # Fields: none. internal/run/planning.go supplies actual receipt/contract separately.
  planning.revision: |2-
    Revision pending: preserve files; affected workers pause at their next tool boundary. Use the actual
    target/contract below. plan(invoke="EDIT", field="<field>", value="<replacement>") revises one requirement.
    After reconciling the request, plan(invoke="COMPLETE") records reconciliation, not correctness.
    Plan fields: title/goal. Approach: title (strategy). Task: title/prompt/current/target/sketch/acceptance/
    tests/verify/check_command/acceptance_command. Preserve guided goal/strategy/sketch JSON structure.
    Explicit requeue, real Ready and fresh checked/reviewed execution remain required.
  # Fields: none. This form is exposed only for a stopped task with a resolved current-attempt revision.
  planning.revision_requeue: |2-
    Revision reconciled: plan(invoke="REQUEUE") requests a fresh task attempt, not execution.
    Recheck the approach through Ready and obtain fresh start approval. Preserve prior failed/stopped
    evidence and artifacts.
  # Fields: none. Explicit whitelisted authored column; not an arbitrary storage expression.
  planning.answer.field: >-
    Which one authored requirement must change? Use an allowed field for the actual target kind.
  # Fields: none. Full replacement authored by the model; empty values remain unready drafts.
  planning.answer.value: >-
    What is the complete replacement value for that requirement? Preserve facts and structured answers.

  # Discovery cadence direction review; not the hard repeat/stall authorization gate.
  # Owner: internal/agent/loop.go. Fields: none; original request/replies/receipts supplied in context.
  decision.discovery.instructions: >2-
    Choose the next direction from the latest observed work, not its stated intentions.
    Use Checkpoint for the active role and UnfinishedResponse for current deliberation;
    previous receipts describe already completed actions. Continue when inspection, reasoning,
    planning answers or effects add useful information. Long reasoning alone is not failure.
    Reconsider when the model repeatedly asks or answers the same question without new evidence,
    even if it says it will stop circling or run a check next. Direct it to inspect the specific
    missing fact or conclude from established evidence; do not request more of the same deliberation.
    Repair only an unresolved rejected call shown in PendingRepair or PreflightRefusal, using
    CurrentToolSchema. Resolved refusals are history. A reviewer assesses only its frozen Task,
    inspects missing evidence and gives a verdict; it does not implement sibling work. A worker
    with current passed checks gives a final answer for independent review. PAT drafting saves
    metadata; execution follows the Approach briefs, readiness and claim. Authored intentions and
    advice are not effects. Continue sends no message; advice cannot stop or discard reasoning,
    grant authority, or establish verification.

  # Choice statements, ordered by the owning Go direction review.
  decision.discovery.continue: "continue productive work"
  decision.discovery.act: "repair the latest rejected call"
  # Legacy compatibility key retained for editable catalogs. Continue sends no model message.
  # The supervision owner does not render this body. Fields: none.
  continuation.discovery.continue: |
    Legacy compatibility entry: Continue leaves the model's context and unfinished response unchanged and sends no model message.
  continuation.discovery.act: |2
    Repair the latest rejected call using its actual refusal and current schema. Send only its
    advertised arguments; use the native example below when supplied. Preserve source and command
    bytes, real approvals and verification. This advice grants no authority or success.

  # Ordinary coding progress cue; no selected PAT or task claim is implied. Fields: none.
  progress.ordinary: |2-
    Continue the requested coding work with current tools. Inspect missing facts, implement the
    requested behavior with meaningful assertions and check the actual result. Preserve failures.

  # Latest actual refused/failed call takes priority over generic phase advice. Fields: none.
  progress.refused_call: "Use the latest actual refusal/failure and current advertised schema to repair the call or reconsider its method."

  # A whole-array refusal applies to every member; the host does not infer an offender from prose.
  # Fields: none. Each submitted tool's current definition remains distinguishable.
  progress.refused_array: "The entire submitted array was refused. Use its actual refusal and each submitted tool's current schema; the final member is not necessarily the offending call."

  # Registry could not resolve this exact compatibility spelling; no nearest tool is guessed.
  # Fields: .Name, .Tools. Current names do not manufacture availability or authority.
  progress.call_unavailable: |-
    No current callable definition resolves {{printf "%q" .Name}}.
    Current available tool names: {{.Tools}}.

  # Specific repair aid from the latest actual refusal and current Definition.Schema.
  # Fields: .Refusal, .Schema. It does not replace actual authorization or owner state.
  continuation.progress.current_call: |-
    Latest actual refusal/failure:
    {{.Refusal}}
    Current advertised schema and native example:
    {{.Schema}}

  # Legacy compatibility entries; failed advisory judgments and Continue send no model message.
  # These bodies are not rendered by the supervision owner. Fields: none.
  continuation.discovery.uncertain: >-
    Legacy compatibility entry: a failed advisory judgment leaves the model continuing unchanged;
    no model message is sent.
  continuation.discovery.stop: "Legacy compatibility entry: progress supervision cannot terminate the model."

  # Legacy low-confidence prefix retained for editable catalogs; no longer rendered by supervision.
  # Failed advisory judgments send no model message. Fields: none.
  continuation.discovery.uncertain_direction_prefix: >-
    Legacy compatibility entry: failed advisory direction is recorded without a model message.

  # Compact active registry index used when full broad help exceeds the existing output page.
  # Owner: internal/tools/help.go. Fields: Names (string).
  help.compact_index: |-
    Active tools: {{.Names}}. help(topic="schema") lists current tool descriptions; schema.<tool> gives exact arguments. help(topic="<tool>") gives use cases; guide opens comprehensive help; reference opens the workflow index.

  # Focused help framing; Go determines actual executable availability at the moment of the read.
  # Fields: Name, Schema. This never adds a definition to the active registry.
  help.available: "\nAvailability: {{.Name}} is available in the current tool view.\nCurrent schema:\n{{.Schema}}"
  # Fields: none. Unavailable documentation intentionally has no executable schema.
  help.unavailable: >-
    Availability: unavailable in the current tool view. This documented capability grants no call
    authority and has no current schema here. Read help(topic="reference.scope") for scope selection;
    use only the next actually advertised schema after selecting the appropriate scope.
  # Unknown-topic recovery stays editable; Topic is the actual requested topic, never a guessed tool.
  # Fields: Topic. This is an error guide, not a callable tool or reference document.
  guidance.help.unknown: |-
    help topic {{printf "%q" .Topic}} is unknown; use help(topic="schema") for available tools or help(topic="reference") for workflow documents

  # Tiny topical reference library, independent of the authoring Q/A and executable tool view.
  # Canonical source is this YAML. Startup derives versioned project knowledge under
  # harness/reference/<topic> via its existing owner; help returns only the selected document.
  # These texts are editorially short (target under 1000 tokens each), not runtime admission caps.
  # Fields: none for all reference documents. Add needed topics here, not a second prompt source.
  help.reference.index: |2
    ## Reference index
    References explain capabilities and legal workflows; they grant no execution or verification authority.
    - reference.pat: Plan → Approach → Task lifecycle and guided Q/A.
    - reference.workers: main-task execution, optional workers and independent review.
    - reference.scope: capability existence, current availability and selecting scope.
    - reference.tools: source navigation, graph arguments, authorization and recovery.
    Request one with help(topic="reference.pat"). The same startup-published document is graph-addressable:
    graphql(query='query { knowledge(key:"harness/reference/pat",limit:1) { key body } }').
    These documents are separate from plan's current authoring questions. Current advertised schemas determine actual calls.

  help.reference.pat: |2
    ## Reference: PAT lifecycle
    A Plan records outcome/rules/deliverables/proof; an article is a delivery scope with its own Approach.
    Tasks own behavior/assertions/implementation/checks/review; honor requested grouping.
    Related Tasks may share an article/Approach. Outside selected PAT, ordinary coding needs no PAT.
    Main/orchestrator: call plan(), answer the newest schema, then wait; the host binds IDs.
    Earlier checkpoint advice is historical. Draft objective → observations/target → proof, then subtask
    objective → execution → validation → more. more=true asks another subtask objective;
    more=false finishes subtask drafting and asks for later review criteria, not an actual review. For work already implemented, draft from known observations/receipts;
    preserve the fix and plan remaining work, fresh paired checks and independent review. Draft intentions
    are not executed commands; prior receipts are historical, not present qualification.
    In DRAFT TASKS, plan(invoke="TASK", title="<title>", objective="<outcome>") adds a task;
    plan(invoke="COMPLETE") requests readiness after all approach briefs. At START, plan(invoke="EXECUTE")
    claims the main model's next task; its frozen brief becomes system instructions. Use check for the behavioral command then
    project check; give a normal final answer with no tool call to request independent review.
    Actual check receipts and independent reviewer PASS qualify it; the same suite may serve both roles if it has
    task assertions. Explicit launch dispatches workers. REMEDIATE revises/requeues the same task; fresh
    Ready and start are required. After a verified Task, NEXT returns to claim the next queued Task.
    When all Tasks qualify, compare results with the Approach objective: draft a missing Task with TASK
    if offered, or NEXT_ARTICLE to complete the Approach and draft the next deliverable. Complete the
    Plan only when its original outcome and proof are satisfied; uncovered scope uses existing revision.
    Parents need qualified children. Stops need authorized recovery. GraphQL uses actual IDs/partial effects.

  help.reference.workers: |2
    ## Reference: execution roles
    The main model plans and communicates with the user. At guided START,
    plan(invoke="EXECUTE") claims the next queued task for the main model to execute here.
    Its frozen task becomes system instructions; the host supplies actual IDs, attempts and checks.
    For intentional delegation, explicit launch runs workers for a Ready approach under its current
    schema. Workers implement frozen tasks, preserve constraints/failures and return results; they
    neither recreate PAT nor delegate their own task. For work already implemented, preserve it, address unmet
    requirements and run fresh checks; do not recreate the defect. Planned execution requires real behavioral/
    project checks and independent review. After checks, a normal final answer with no tool call
    requests independent review; no completion tool is needed. Reviewer prose cannot manufacture a pass. Draft/Ready
    state or a launcher exit is not qualification. GraphQL introspection lists graph operations,
    not execution tools. Workers without GraphQL report useful observations with their
    evidence and uncertainty; the orchestrator records them with noticed for the actual Approach.
    Reviewers remain read-only and report review findings through their existing verdict.
    Read help(topic="launch") or help(topic="reference.scope") for details.

  help.reference.scope: |2
    ## Reference: capability and current scope
    A documented capability may exist while unavailable in the current model tool view. help can explain it without registering it. Available focused help includes the actual current schema; unavailable help labels that state and includes no current executable schema.
    Execution tools and the GraphQL schema describe different interfaces. GraphQL's Mutation lists graph owning operations; it does not list plan, launch, coding workers or all execution tools. Inspect current advertised native definitions/help for those capabilities. Discover selected GraphQL types with valid arguments, for example query { __type(name:"Mutation") { fields { name } } }.
    The user can select /tools coding for ordinary coding or /tools full for the full advanced tool view. For requested planning use plan() and its current Q/A; The later START plan(invoke="EXECUTE") binds the main-task claim. Select existing graph work with the current workflow_focus schema or the user workflow view. A selected workflow/role may project narrower parameters and legal actions.
    Scope selection affects a later request. It never gives an earlier call in the same array a new capability, readiness, claim or approval. Use the next advertised schema; do not copy full-view hidden arguments into projected tools. A worker/reviewer remains bound to its assigned role. If the needed scope or prerequisite is unavailable, explain the precise missing condition and legal next action to the user.

  help.reference.tools: |2
    ## Reference: tool navigation, authorization and recovery
    Use find_file/find_dir to locate source, grep to locate a symbol/caller, then read a relevant range. help(topic="read.definition") and help(topic="read.outline") explain read's current navigation arguments; they are documentation aliases, not extra tools. Inspect current bytes/hash and required coverage before editing. Keep actual next_offset with the same query after a capped page.
    GraphQL query is document text, with parentheses and required arguments on parameterized fields. For an unnamed query omit operation_name; for query Inspect { ... } use operation_name="Inspect". variables is one JSON-object string. A selected reference query is query { knowledge(key:"harness/reference/pat",limit:1) { key body } }. Read selected fields and actual IDs. Updates to authored knowledge require the actual head as expectedPreviousId; never guess it. Startup owns the harness/reference namespace and preserves its version history.
    Record an Approach weak spot or opportunity with noticed; help(topic="schema.graphql.noticed")
    gives its signature and example. Use notices to recall that Approach's notes. Include evidence and
    uncertainty, retain the returned ID, then continue the task. Notes do not change scope or qualify work.
    Authorization follows the configured YOLO/all/risky policy and actual arguments. Reading documentation grants no tool, claim or approval. A denial, unknown verdict or missing prerequisite remains explicit. Correct refused arguments with the current schema; ask only for a required user decision. Automatic progress supervision: Continue/confidence below 0.5 sends no nudge and leaves the coding model unchanged.
    After errors, partial mutations, response interruption or resume, retain and use the settled call/result receipts already in context. Inspect only a missing fact or state that may have changed externally. A historical PASS grants no current verification authority. Cancellation does not authorize restart. Recover through the existing explicit workflow and rerun the required current checks after later effects.

