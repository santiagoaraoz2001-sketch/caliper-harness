name: Build complete release folders
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version
        required: true
        default: '0.2.1'
      platform:
        description: Platform to build and validate
        type: choice
        required: false
        default: all
        options:
          - all
          - windows-amd64
          - linux-amd64
          - darwin-arm64
          - linux-arm64
      upload_to_draft:
        description: Upload validated assets to an existing draft targeting this exact commit
        type: boolean
        required: false
        default: false
permissions:
  contents: write
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows-amd64' && '[{"runner":"windows-2022","platform":"windows-amd64"}]' || inputs.platform == 'linux-amd64' && '[{"runner":"ubuntu-24.04","platform":"linux-amd64"}]' || inputs.platform == 'darwin-arm64' && '[{"runner":"macos-15","platform":"darwin-arm64"}]' || inputs.platform == 'linux-arm64' && '[{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]' || '[{"runner":"windows-2022","platform":"windows-amd64"},{"runner":"ubuntu-24.04","platform":"linux-amd64"},{"runner":"macos-15","platform":"darwin-arm64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.30'
      - name: Windows native compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc
          update: false
      - name: Build Windows product and test native seams
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:PATH
          $env:CC = 'gcc'
          $env:CGO_ENABLED = '1'
          $env:GOPATH = Join-Path $env:TEMP 'caliper-go-path'
          $env:GOCACHE = Join-Path $env:TEMP 'caliper-go-build-cache'
          $env:GOTOOLCHAIN = 'local'
          ./scripts/test-windows-runtime.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime prerequisite tests failed' }
          & "$env:pythonLocation\python.exe" -m unittest discover -s python/windows -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime normalization/import audit tests failed' }
          ./scripts/ensure-windows-runtime.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows builder requires the Microsoft system runtime; no unattended GUI installation attempted' }
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'module acquisition failed' }
          $kuzu = (& go list -m -f '{{.Dir}}' github.com/kuzudb/go-kuzu).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Kuzu module lookup failed' }
          $env:PATH = (Join-Path $kuzu 'lib\dynamic\windows') + ';' + $env:PATH
          $testHome = Join-Path $env:RUNNER_TEMP 'go-test-home'
          New-Item -ItemType Directory -Force $testHome | Out-Null
          $testEnv = @{ HOME=$testHome; USERPROFILE=$testHome; APPDATA=(Join-Path $testHome 'AppData/Roaming'); LOCALAPPDATA=(Join-Path $testHome 'AppData/Local'); XDG_CONFIG_HOME=(Join-Path $testHome 'config'); XDG_DATA_HOME=(Join-Path $testHome 'data') }
          $previousEnv = @{}
          foreach ($key in $testEnv.Keys) { $previousEnv[$key] = [Environment]::GetEnvironmentVariable($key, 'Process'); [Environment]::SetEnvironmentVariable($key, $testEnv[$key], 'Process') }
          try {
            go test -count=1 ./internal/watch ./internal/decision ./internal/update ./internal/bundle ./internal/config ./internal/session ./internal/tools/ask ./internal/tools/bash ./internal/store ./cmd/specific-harness ./internal/tui
            if ($LASTEXITCODE -ne 0) { throw 'native tests failed' }
            go test -count=1 -timeout 240s -run 'Test(RecallLocators|RecallMetadata|QueryProjectRecallLocators|ExistingPath|AmbiguousCopiedPath|CopiedPath|StreamActivity|ProjectStyleSnapshot|OldCatalogProjectStyleFallback|ProgressWireHasOneCurrentCheckpoint|GuidedCoverage|PlanCoverage|ProgressOwner|ReviewCapturedConclusion|ReviewConclusion|CancelledCapturedLagunaReasoningRetainsResumeWithoutRetry|PartialFailureRetainsAliasesAndArgumentDraftWithoutRetry|OutputLimitContinuationsRetainPrefixAndExecuteOnce|SupervisionNativeContinuationPreservesPrefixAndSilence|SupervisionBookkeepingRunnerDoesNotPublishSilentVerdict|OutputLimitPromptMeasurementWithoutContinuationPrefix|ThinkingLoopRunnerArchiveAndSummary)' ./internal/memory ./internal/tools/search ./internal/tools/files ./internal/llm ./internal/run ./internal/agent ./internal/plan ./internal/launch
            if ($LASTEXITCODE -ne 0) { throw 'native notebook/style/path/activity/PAT/review tests failed' }
          } finally {
            foreach ($key in $testEnv.Keys) { [Environment]::SetEnvironmentVariable($key, $previousEnv[$key], 'Process') }
          }
          ./scripts/test-install-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer preservation tests failed' }
          ./scripts/bundle-windows-managed.ps1 -Out "$env:RUNNER_TEMP/Caliper" -AllowDownloads
          if ($LASTEXITCODE -ne 0) { throw 'product build failed' }
          $builderPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:RUNNER_TEMP\Caliper\bin"
          & "$env:RUNNER_TEMP/Caliper/caliper.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'native product launch failed without compiler/module PATH' }
          $env:PATH = $builderPath
          & "$env:pythonLocation\python.exe" -m pip install --only-binary=:all: pywinpty==2.0.15
          if ($LASTEXITCODE -ne 0) { throw 'Windows native terminal test dependency failed' }
          & "$env:pythonLocation\python.exe" scripts/test-manage-status.py "$env:RUNNER_TEMP/Caliper" "$env:RUNNER_TEMP/manage-status-proof" --component-tests
          if ($LASTEXITCODE -ne 0) { throw 'Windows /status and /manage native validation failed' }
          $package = & "$env:pythonLocation\python.exe" scripts/package-release.py "$env:RUNNER_TEMP/Caliper" --version "$env:RELEASE_VERSION" --out dist
          if ($LASTEXITCODE -ne 0) { throw 'release packaging failed' }
          $package | Set-Content "$env:RUNNER_TEMP/release.json"
          $release = $package | ConvertFrom-Json
          $asset = if ($release.archive) { $release.archive } else { $release.parts_manifest }
          if (-not $asset) { throw 'packager returned no complete release transport' }
          npm ci --prefix scripts/npm --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm launcher dependencies failed' }
          node scripts/test-npm-release.cjs "$asset" "$env:RUNNER_TEMP/npm-native-proof"
          if ($LASTEXITCODE -ne 0) { throw 'native npm product install and launch failed' }
      - name: Build Linux product and test native seams
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The full GPU runtime needs space for its build and a second install
          # proof. Display disk evidence; never substitute a smaller CPU product.
          df -h "$RUNNER_TEMP"
          export GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local
          GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local go mod download
          mkdir -p "$RUNNER_TEMP/go-test-home"
          HOME="$RUNNER_TEMP/go-test-home" USERPROFILE="$RUNNER_TEMP/go-test-home" APPDATA="$RUNNER_TEMP/go-test-home/AppData/Roaming" LOCALAPPDATA="$RUNNER_TEMP/go-test-home/AppData/Local" XDG_CONFIG_HOME="$RUNNER_TEMP/go-test-home/config" XDG_DATA_HOME="$RUNNER_TEMP/go-test-home/data" GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local go test -count=1 ./internal/watch ./internal/decision ./internal/update ./internal/bundle ./internal/config ./internal/session ./internal/tools/ask ./internal/tools/bash ./internal/store ./cmd/specific-harness ./internal/tui
          HOME="$RUNNER_TEMP/go-test-home" USERPROFILE="$RUNNER_TEMP/go-test-home" APPDATA="$RUNNER_TEMP/go-test-home/AppData/Roaming" LOCALAPPDATA="$RUNNER_TEMP/go-test-home/AppData/Local" XDG_CONFIG_HOME="$RUNNER_TEMP/go-test-home/config" XDG_DATA_HOME="$RUNNER_TEMP/go-test-home/data" GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local go test -count=1 -timeout 240s -run 'Test(RecallLocators|RecallMetadata|QueryProjectRecallLocators|ExistingPath|AmbiguousCopiedPath|CopiedPath|StreamActivity|ProjectStyleSnapshot|OldCatalogProjectStyleFallback|ProgressWireHasOneCurrentCheckpoint|GuidedCoverage|PlanCoverage|ProgressOwner|ReviewCapturedConclusion|ReviewConclusion|CancelledCapturedLagunaReasoningRetainsResumeWithoutRetry|PartialFailureRetainsAliasesAndArgumentDraftWithoutRetry|OutputLimitContinuationsRetainPrefixAndExecuteOnce|SupervisionNativeContinuationPreservesPrefixAndSilence|SupervisionBookkeepingRunnerDoesNotPublishSilentVerdict|OutputLimitPromptMeasurementWithoutContinuationPrefix|ThinkingLoopRunnerArchiveAndSummary)' ./internal/memory ./internal/tools/search ./internal/tools/files ./internal/llm ./internal/run ./internal/agent ./internal/plan ./internal/launch
          bash scripts/bundle-linux.sh "$RUNNER_TEMP/Caliper"
          LD_LIBRARY_PATH="$RUNNER_TEMP/Caliper/lib" "$RUNNER_TEMP/Caliper/caliper-harness" version
          python scripts/test-manage-status.py "$RUNNER_TEMP/Caliper" "$RUNNER_TEMP/manage-status-proof" --component-tests
          python scripts/package-release.py "$RUNNER_TEMP/Caliper" --version "$RELEASE_VERSION" --out dist > "$RUNNER_TEMP/release.json"
          asset=$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p["archive"] or p["parts_manifest"])' "$RUNNER_TEMP/release.json")
          test -f "$asset"
          # Only this job's built scratch folder is removed after successful
          # packaging. Verified release transport remains; npm independently
          # reconstructs it. This avoids three simultaneous GPU runtime copies.
          rm -rf -- "$RUNNER_TEMP/Caliper"
          npm ci --prefix scripts/npm --ignore-scripts
          node scripts/test-npm-release.cjs "$asset" "$RUNNER_TEMP/npm-native-proof"
      - name: Build macOS product and test native seams
        if: runner.os == 'macOS'
        shell: bash
        run: |
          df -h "$RUNNER_TEMP"
          export GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local
          GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local go mod download
          mkdir -p "$RUNNER_TEMP/go-test-home"
          HOME="$RUNNER_TEMP/go-test-home" USERPROFILE="$RUNNER_TEMP/go-test-home" APPDATA="$RUNNER_TEMP/go-test-home/AppData/Roaming" LOCALAPPDATA="$RUNNER_TEMP/go-test-home/AppData/Local" XDG_CONFIG_HOME="$RUNNER_TEMP/go-test-home/config" XDG_DATA_HOME="$RUNNER_TEMP/go-test-home/data" GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local go test -count=1 ./internal/watch ./internal/decision ./internal/update ./internal/bundle ./internal/config ./internal/session ./internal/tools/ask ./internal/tools/bash ./internal/store ./cmd/specific-harness ./internal/tui
          HOME="$RUNNER_TEMP/go-test-home" USERPROFILE="$RUNNER_TEMP/go-test-home" APPDATA="$RUNNER_TEMP/go-test-home/AppData/Roaming" LOCALAPPDATA="$RUNNER_TEMP/go-test-home/AppData/Local" XDG_CONFIG_HOME="$RUNNER_TEMP/go-test-home/config" XDG_DATA_HOME="$RUNNER_TEMP/go-test-home/data" GOPATH=/tmp/go-path GOCACHE=/tmp/go-build-cache GOTOOLCHAIN=local go test -count=1 -timeout 240s -run 'Test(RecallLocators|RecallMetadata|QueryProjectRecallLocators|ExistingPath|AmbiguousCopiedPath|CopiedPath|StreamActivity|ProjectStyleSnapshot|OldCatalogProjectStyleFallback|ProgressWireHasOneCurrentCheckpoint|GuidedCoverage|PlanCoverage|ProgressOwner|ReviewCapturedConclusion|ReviewConclusion|CancelledCapturedLagunaReasoningRetainsResumeWithoutRetry|PartialFailureRetainsAliasesAndArgumentDraftWithoutRetry|OutputLimitContinuationsRetainPrefixAndExecuteOnce|SupervisionNativeContinuationPreservesPrefixAndSilence|SupervisionBookkeepingRunnerDoesNotPublishSilentVerdict|OutputLimitPromptMeasurementWithoutContinuationPrefix|ThinkingLoopRunnerArchiveAndSummary)' ./internal/memory ./internal/tools/search ./internal/tools/files ./internal/llm ./internal/run ./internal/agent ./internal/plan ./internal/launch
          bash scripts/bundle-macos.sh "$RUNNER_TEMP/Caliper"
          "$RUNNER_TEMP/Caliper/caliper-harness" version
          python scripts/test-manage-status.py "$RUNNER_TEMP/Caliper" "$RUNNER_TEMP/manage-status-proof" --component-tests
          python scripts/package-release.py "$RUNNER_TEMP/Caliper" --version "$RELEASE_VERSION" --out dist > "$RUNNER_TEMP/release.json"
          asset=$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p["archive"] or p["parts_manifest"])' "$RUNNER_TEMP/release.json")
          test -f "$asset"
          npm ci --prefix scripts/npm --ignore-scripts
          node scripts/test-npm-release.cjs "$asset" "$RUNNER_TEMP/npm-native-proof"
      - uses: actions/upload-artifact@v4
        with:
          name: caliper-${{ inputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Stage validated assets in the requested draft
        if: inputs.upload_to_draft
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, re, subprocess
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version):
              raise SystemExit('Expected a stable release version')
          tag = 'v' + version
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,targetCommitish']))
          if not release['isDraft'] or release['targetCommitish'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Draft must target the exact build commit')
          assets = sorted(str(p) for p in pathlib.Path('dist').iterdir() if p.is_file())
          if not assets:
              raise SystemExit('No validated release assets')
          subprocess.run(['gh', 'release', 'upload', tag, *assets], check=True)
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caliper-${{ inputs.version }}-${{ matrix.platform }}-ui-proof
          path: ${{ runner.temp }}/manage-status-proof
          if-no-files-found: warn
